name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Check out the tagged commit itself, so the published bytes are always the
      # code that was tagged.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          # Pad to the four-part version Jellyfin expects.
          while [ "$(echo "$VERSION" | tr -cd '.' | wc -c)" -lt 3 ]; do VERSION="${VERSION}.0"; done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${RAW#v}" >> "$GITHUB_OUTPUT"

      # A tag on a commit that never reached the default branch would publish code
      # nobody can see on main. Refuse instead of shipping it.
      - name: Refuse to release a commit that is not on the default branch
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on origin/$DEFAULT_BRANCH."
            echo "::error::Push the branch first, then re-tag, so the release matches what is on $DEFAULT_BRANCH."
            exit 1
          fi
          echo "$GITHUB_SHA is on origin/$DEFAULT_BRANCH"

      - name: Build
        run: |
          dotnet publish Jellyfin.Plugin.AutoPlaylist/Jellyfin.Plugin.AutoPlaylist.csproj \
            -c Release -o publish \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }}

      - name: Package
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/package.py \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --changelog "$(git log -1 --pretty=%s "$GITHUB_SHA")"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Install by adding the manifest URL from the README as a Jellyfin plugin repository." \
            artifacts/*.zip \
            || gh release upload "${{ steps.version.outputs.tag }}" artifacts/*.zip --clobber

      # The manifest has to live on the default branch, but the checksum must describe
      # the asset just uploaded — so reuse that exact zip rather than rebuilding it.
      - name: Update the manifest on the default branch
        run: |
          git fetch --quiet origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          python3 .github/scripts/package.py \
            --manifest-only \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --changelog "$(git log -1 --pretty=%s "$GITHUB_SHA")"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git diff --staged --quiet && exit 0
          git commit -m "manifest: ${{ steps.version.outputs.version }}"
          git push origin "HEAD:$DEFAULT_BRANCH"

overview: "LLM-curated music playlists, built from your own library"
description: >
  AutoPlaylist turns your Jellyfin music library into a growing set of thematic,
  hand-curated playlists. A local LLM served by Ollama looks at what your library
  actually holds, chooses an angle, then picks every track by musical judgment —
  no genre-filter automation. Playlists it owns are marked with a tag, so your own
  playlists are never touched. Runs nightly as a scheduled task.
